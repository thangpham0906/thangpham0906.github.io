---
layout: default
---

<div class="reading-container" style="padding-top: var(--space-8); padding-bottom: var(--space-16);">
  <nav class="breadcrumbs" aria-label="Breadcrumbs" style="margin-bottom: var(--space-6);">
    <a href="{{ '/' | relative_url }}">Home</a>
    <span>/</span>
    <a href="{{ '/categories/' | relative_url }}">Categories</a>
    <span>/</span>
    <span aria-current="page">{{ page.title }}</span>
  </nav>

  <header style="margin-bottom: var(--space-8); border-bottom: 1px solid var(--border-subtle); padding-bottom: var(--space-6);">
    <h1 style="font-size: clamp(2rem, 4vw, 2.75rem); margin-bottom: var(--space-2);">Category: <span style="color: var(--accent);">{{ page.title }}</span></h1>
    <p style="font-size: 1.125rem; color: var(--text-secondary);">Technical posts archived under {{ page.title }}.</p>
  </header>

  <div class="blog-list">
    {% for post in page.posts %}
      <article class="blog-item">
        <div class="blog-item-meta">
          <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %d, %Y" }}</time>
        </div>
        <h3 class="blog-item-title">
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </h3>
        <p class="blog-item-excerpt">
          {{ post.excerpt | strip_html | truncatewords: 30 }}
        </p>
      </article>
    {% endfor %}
  </div>
</div>
