---
layout: default
---

<div class="reading-container" style="padding-top: var(--space-8); padding-bottom: var(--space-16);">
  <header style="margin-bottom: var(--space-8); border-bottom: 1px solid var(--border-subtle); padding-bottom: var(--space-6);">
    <h1 style="font-size: clamp(2rem, 4vw, 2.75rem); margin-bottom: var(--space-2);">Tags</h1>
    <p style="font-size: 1.125rem; color: var(--text-secondary);">Browse technical articles by topic tag.</p>
  </header>

  {% for tag in site.tags %}
    <div style="margin-bottom: var(--space-8);">
      <h2 style="font-size: 1.25rem; margin-bottom: var(--space-3);">
        <span class="badge badge-accent">#{{ tag[0] }}</span>
      </h2>
      <ul style="list-style: none; padding-left: 0;">
        {% for post in tag[1] %}
          <li style="margin-bottom: var(--space-2); display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--border-subtle); padding-bottom: var(--space-2);">
            <a href="{{ post.url | relative_url }}" style="color: var(--text-primary); text-decoration: none; font-weight: 550;">{{ post.title }}</a>
            <time datetime="{{ post.date | date_to_xmlschema }}" style="font-family: var(--font-mono); font-size: 0.8125rem; color: var(--text-muted);">{{ post.date | date: "%Y-%m-%d" }}</time>
          </li>
        {% endfor %}
      </ul>
    </div>
  {% endfor %}
</div>
