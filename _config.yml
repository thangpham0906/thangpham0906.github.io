# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: en

# Change to your timezone
timezone: Asia/Ho_Chi_Minh

# jekyll-seo-tag settings
# ↓ --------------------------

title: Pham Quoc Thang
tagline: Backend Software Engineer | E-Commerce, APIs & System Integrations
description: >-
  Backend Software Engineer with over 4 years of experience specializing in scalable backend architectures, high-volume e-commerce platforms, RESTful APIs, and enterprise system integrations.

# Fill in the protocol & hostname for your site.
url: "https://thangpham0906.github.io"

github:
  username: thangpham0906

social:
  name: Pham Quoc Thang
  email: thangpham0906@gmail.com
  links:
    - https://github.com/thangpham0906
    - https://linkedin.com/in/thangpham0906

# ↑ --------------------------

theme_mode: dark # Preference

# the avatar on sidebar
avatar: /assets/img/hero-bg.png

toc: true

paginate: 10

baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  projects:
    output: true
    permalink: /projects/:title/
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
